    <style>
      html, body { margin: 0; background: #020617; }
      #splash { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: radial-gradient(600px 300px at 50% 20%, rgba(10,91,255,.12), transparent), #020617; color: #f1f5f9; font-family: Inter, system-ui, sans-serif; }
      #splash .mark { width: 56px; height: 56px; border-radius: 14px; background: linear-gradient(135deg, #8052ff, #15846e); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 24px; color: #fff; }
      #splash .bar { width: 180px; height: 4px; border-radius: 9999px; background: #1e293b; overflow: hidden; }
      #splash .bar > div { height: 100%; width: 40%; border-radius: 9999px; background: linear-gradient(90deg, #8052ff, #ffb829); animation: shslide 1.1s ease-in-out infinite alternate; }
      @keyframes shslide { from { transform: translateX(-60%); } to { transform: translateX(280%); } }
      #splash p { margin: 0; font-size: 14px; color: #94a3b8; }
    </style>
